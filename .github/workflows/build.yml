name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dylib:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v7

      - name: Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Dependencies
        run: brew install ldid

      - name: Build
        run: make

      - name: Check dylib
        run: |
          dylib=.theos/obj/ytminload.dylib
          test "$(otool -D "$dylib" | tail -1)" = "@rpath/ytminload.dylib"
          if otool -L "$dylib" | grep -qiE 'substrate|ellekit'; then
            echo "::error::hooking framework is linked"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ytminload-dylib
          path: .theos/obj/ytminload.dylib
          if-no-files-found: error
