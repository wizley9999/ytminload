name: IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dylib:
    uses: ./.github/workflows/build.yml

  ipa:
    needs: dylib
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - uses: actions/download-artifact@v8
        with:
          name: ytminload-dylib

      - name: Check
        run: python ytm.py check ipa

      - name: Pack
        run: python ytm.py pack ipa ytminload.dylib
